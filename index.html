<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Signup Page</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <!-- Toggle Buttons -->
    <div class="toggle-buttons">
      <button onclick="showForm('login')">Login</button>
      <button onclick="showForm('signup')">Signup</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="return validateLogin()" class="form hidden">
      <h2>Login</h2>
      <label>Email:</label>
      <input type="email" id="loginEmail" required />
      
      <label>Password:</label>
      <input type="password" id="loginPassword" required minlength="6"/>
      
      <button type="submit">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" onsubmit="return validateSignup()" class="form hidden">
      <h2>Signup</h2>
      <label>Full Name:</label>
      <input type="text" id="signupName" required />

      <label>Email:</label>
      <input type="email" id="signupEmail" required />
      
      <label>Password:</label>
      <input type="password" id="signupPassword" required minlength="6" />
      
      <label>Confirm Password:</label>
      <input type="password" id="confirmPassword" required />
      
      <button type="submit">Signup</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
